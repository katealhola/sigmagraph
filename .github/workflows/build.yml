name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x86_64
            arch: x86_64
          - runner: macos-15
            target: macos-arm64
            arch: arm64
          - runner: ubuntu-24.04
            target: linux-x86_64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_ARCH: ${{ matrix.arch }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Verify native architecture
        run: python -c "import os, platform; assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()"
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libusb-1.0-0 binutils
      - name: Install application and build dependencies
        run: python -m pip install -e '.[build]'
      - name: Run portable tests
        run: python scripts/run_tests.py
      - name: Build standalone application
        run: python build.py --output dist
      - name: Smoke-test packaged macOS GUI
        if: runner.os == 'macOS'
        run: dist/SigmaGraph.app/Contents/MacOS/SigmaGraph --smoke-test
      - name: Smoke-test packaged Linux GUI
        if: runner.os == 'Linux'
        run: dist/SigmaGraph/SigmaGraph --smoke-test
      - name: Package and checksum native application
        run: python scripts/package_release.py --expected-target '${{ matrix.target }}'
      - name: Upload application archive and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SigmaGraph-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  source:
    name: Python source and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install build frontend
        run: python -m pip install 'build>=1.2,<2'
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check package data and license
        run: python scripts/check_packages.py
      - name: Upload Python packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SigmaGraph-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30
